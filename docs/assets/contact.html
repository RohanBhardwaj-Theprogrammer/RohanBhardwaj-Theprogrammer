<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Email Server — Rohan Bhardwaj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: rgba(22, 27, 34, 0.85);
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #5b8def;
        --border: rgba(139, 148, 158, 0.2);
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        background-image: radial-gradient(
          ellipse at 50% 0%,
          rgba(91, 141, 239, 0.06) 0%,
          transparent 60%
        );
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* ------- Loading screen ------- */
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(13, 17, 23, 0.95);
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      .loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .loader-icon {
        width: 60px;
        height: 60px;
        margin-bottom: 1.5rem;
        animation: spin 1.2s linear infinite;
      }
      .loader-icon svg {
        width: 100%;
        height: 100%;
        stroke: var(--accent);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .loading-text {
        font-size: 1rem;
        color: var(--muted);
        letter-spacing: 0.02em;
        animation: pulse-text 1.5s infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse-text {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* ------- Main overlay & card ------- */
      .main-overlay {
        position: fixed;
        inset: 0;
        background: rgba(13, 17, 23, 0.7);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        animation: fadeIn 0.4s ease;
      }
      .main-overlay.hidden {
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .card {
        position: relative;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        max-width: 420px;
        width: 90%;
        text-align: center;
        box-shadow: var(--shadow);
        animation: slideUp 0.5s ease;
      }

      .icon-container {
        margin-bottom: 1.8rem;
      }
      .icon-circle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background: rgba(91, 141, 239, 0.08);
        border: 1px solid rgba(91, 141, 239, 0.25);
      }
      .icon-circle svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.3rem;
        letter-spacing: -0.02em;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
        padding: 0.35rem 1.2rem;
        border-radius: 2rem;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1.8rem;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .status-badge::before {
        content: "";
        display: block;
        width: 7px;
        height: 7px;
        background: #f59e0b;
        border-radius: 50%;
        box-shadow: 0 0 6px #f59e0b;
        animation: pulse-dot 1.8s infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.3);
        }
      }

      .description {
        font-size: 0.95rem;
        line-height: 1.65;
        color: var(--muted);
        margin-bottom: 2rem;
      }
      .description a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .description a:hover {
        text-decoration: underline;
      }

      /* Circular timer */
      .progress-ring {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
      }
      .progress-ring svg {
        transform: rotate(-90deg);
        width: 100%;
        height: 100%;
      }
      .progress-ring .bg {
        fill: none;
        stroke: rgba(139, 148, 158, 0.15);
        stroke-width: 5;
      }
      .progress-ring .fg {
        fill: none;
        stroke: url(#grad);
        stroke-width: 5;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.5s ease;
      }
      .ring-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 1px;
      }

      .action-links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 1.8rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.5rem;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 12px rgba(91, 141, 239, 0.3);
      }
      .btn-primary:hover {
        background: #4a7bd9;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(91, 141, 239, 0.4);
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: #6b7280;
        transform: translateY(-2px);
      }

      .close-hint {
        font-size: 0.8rem;
        color: #6b7280;
      }
      .close-hint kbd {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid #374151;
        border-radius: 5px;
        padding: 0.1rem 0.4rem;
        font-family: inherit;
        font-size: 0.75rem;
        margin: 0 2px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.8rem;
        }
        .title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader-icon">
        <!-- Spinning gear icon -->
        <svg
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </div>
      <p class="loading-text">Establishing secure connection…</p>
    </div>

    <!-- Main contact card (hidden initially) -->
    <div class="main-overlay" id="mainOverlay" style="display: none">
      <div class="card">
        <!-- Custom email‑server icon (shield + envelope) -->
        <div class="icon-container">
          <div class="icon-circle">
            <svg
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
              fill="none"
            >
              <path d="M12 2l7 4v5c0 5-3.1 9.3-7 11-3.9-1.7-7-6-7-11V6l7-4z" />
              <rect
                x="7"
                y="8"
                width="10"
                height="8"
                rx="1.5"
                stroke-width="1.5"
              />
              <path d="M7 9l5 3.5L17 9" stroke-width="1.5" />
            </svg>
          </div>
        </div>

        <h1 class="title">Private Email Server</h1>
        <div class="status-badge">Under Development</div>

        <p class="description">
          A secure, encrypted contact endpoint is being deployed.<br />
          In the meantime, reach out via
          <a
            href="https://www.linkedin.com/in/rohan-bhardwaj-at/"
            target="_blank"
            >LinkedIn</a
          >
          or
          <a
            href="https://github.com/RohanBhardwaj-Theprogrammer"
            target="_blank"
            >GitHub</a
          >.
        </p>

        <!-- Countdown ring -->
        <div class="progress-ring">
          <svg>
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5b8def" />
                <stop offset="100%" stop-color="#7c9ff2" />
              </linearGradient>
            </defs>
            <circle class="bg" cx="40" cy="40" r="36"></circle>
            <circle
              class="fg"
              id="progressCircle"
              cx="40"
              cy="40"
              r="36"
              stroke-dasharray="226.19"
              stroke-dashoffset="0"
            ></circle>
          </svg>
          <div class="ring-text" id="ringTimer">8</div>
        </div>

        <div class="action-links">
          <a
            href="https://www.linkedin.com/in/rohan-bhardwaj-at/"
            target="_blank"
            class="btn btn-primary"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
              />
            </svg>
            LinkedIn
          </a>
          <a
            href="https://github.com/RohanBhardwaj-Theprogrammer"
            target="_blank"
            class="btn btn-secondary"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            GitHub
          </a>
        </div>

        <div class="close-hint">
          Auto‑closes in <span id="countdownText">8s</span> · Click outside or
          press <kbd>Esc</kbd>
        </div>
      </div>
    </div>

    <script>
      // ========== Loading screen logic ==========
      const loadingOverlay = document.getElementById("loadingOverlay");
      const mainOverlay = document.getElementById("mainOverlay");

      // Show loading for a short time then transition
      window.addEventListener("load", () => {
        setTimeout(() => {
          // Fade out loader
          loadingOverlay.classList.add("fade-out");
          // After fade-out, show the main content and hide loader completely
          setTimeout(() => {
            loadingOverlay.style.display = "none";
            mainOverlay.style.display = "flex"; // make visible
            // Start the countdown
            startMainTimer();
          }, 500); // match CSS transition duration
        }, 600); // loading shown for 1.5 seconds
      });

      // ========== Timer & redirect logic ==========
      const overlay = mainOverlay;
      const ringText = document.getElementById("ringTimer");
      const progressCircle = document.getElementById("progressCircle");
      const countdownText = document.getElementById("countdownText");
      const totalTime = 8;
      let secondsLeft = totalTime;
      let timerInterval;

      const circumference = 2 * Math.PI * 36; // 226.19
      progressCircle.style.strokeDasharray = circumference;
      progressCircle.style.strokeDashoffset = "0";

      function updateTimerUI() {
        ringText.textContent = secondsLeft;
        countdownText.textContent = `${secondsLeft}s`;
        const offset = circumference * (1 - secondsLeft / totalTime);
        progressCircle.style.strokeDashoffset = offset;
      }

      function closeOverlay() {
        overlay.classList.add("hidden");

        function getRedirectUrl() {
          // 1. If opened via a link with ?ref=... use that exact URL
          // const params = new URLSearchParams(window.location.search);
          // if (params.has("ref")) return params.get("ref");

          // // 2. If the page was opened from another GitHub page, go back there
          // if (document.referrer.startsWith("https://github.com/RohanBhardwaj") || document.referrer.startsWith("https://github.com/rohanbhardwaj-")) {
          //   // console.log(document.referrer);
          //   return document.referrer;
          // }

          // // 3. If there’s an opener (opened with target="_blank" without noopener)
          // //    try to close this tab and keep the original – no redirect needed
          // if (window.opener) {
          //   window.close(); // close this tab (works if opener is same‑origin)
          // }

          // 4. FINAL FALLBACK – your GitHub profile
          return "https://github.com/RohanBhardwaj-Theprogrammer/";
        }

        let redirectTo = getRedirectUrl();
        console.log(redirectTo);
        debugger;

        setTimeout(() => {
          window.location.href = redirectTo;
        }, 400);
      }

      function startMainTimer() {
        updateTimerUI();
        timerInterval = setInterval(() => {
          secondsLeft--;
          updateTimerUI();
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            closeOverlay();
          }
        }, 1000);
      }

      // Click outside modal -> close immediately
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) {
          clearInterval(timerInterval);
          closeOverlay();
        }
      });

      // Esc key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          clearInterval(timerInterval);
          closeOverlay();
        }
      });
    </script>
  </body>
</html>
